name: Stage 7 POP-05 original dock workshop medical exclusive duty native acceptance

on:
  push:
    branches: [sg/stage7-pop05-cross-domain-duty-20261113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage07-pop05-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-domain-duty:
    name: Original exclusive NPC duty and same-SQLite recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Pin exact original source without synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p stage07-pop05-evidence
          printf '%s\n' "$GITHUB_SHA" > stage07-pop05-evidence/source-sha.txt
      - name: Install native Linux SQLite toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev
      - name: Install native Windows SQLite toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:VCPKG_INSTALLATION_ROOT
          if(-not $root){$root='C:\vcpkg'}
          & (Join-Path $root 'vcpkg.exe') install sqlite3:x64-windows --classic
          if($LASTEXITCODE -ne 0){throw 'Native Windows SQLite SDK provisioning failed'}
          "SG_TOOLCHAIN=$(Join-Path $root 'scripts\buildsystems\vcpkg.cmake')" >> $env:GITHUB_ENV
          (Join-Path $root 'installed\x64-windows\bin') >> $env:GITHUB_PATH
      - name: Compile actual original doctor dock and industrial workers
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S . -B build/stage07-pop05 -G 'Visual Studio 17 2022' -A x64 \
              "-DCMAKE_TOOLCHAIN_FILE=$SG_TOOLCHAIN" -DBUILD_TESTING=ON
          else
            cmake -S . -B build/stage07-pop05 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          fi
          cmake --build build/stage07-pop05 --target \
            galaxy_wo2_industry_workforce_tests v59_medical_recovery \
            galaxy_dock03_physical_workforce_tests --config Release --parallel 4
      - name: Require all ORIGINAL plus Stage 7 adversarial native CTests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/stage07-pop05 -C Release --output-on-failure \
            --output-junit "$PWD/stage07-pop05-evidence/native-tests.xml" \
            -R '^(galaxy_wo2_industry_workforce|v59_medical_recovery|galaxy_dock03_physical_workforce|galaxy_stage07_duty_workshop|galaxy_stage07_duty_medical|galaxy_stage07_duty_dock)$' \
            --timeout 180 | tee stage07-pop05-evidence/native-ctest.log
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=list(ET.parse('stage07-pop05-evidence/native-tests.xml').iter('testcase'))
          expected={'galaxy_wo2_industry_workforce','v59_medical_recovery',
                    'galaxy_dock03_physical_workforce','galaxy_stage07_duty_workshop',
                    'galaxy_stage07_duty_medical','galaxy_stage07_duty_dock'}
          assert len(cases)==len(expected) and {c.get('name') for c in cases}==expected
          assert all(c.find(tag) is None for c in cases
                     for tag in ('failure','error','skipped'))
          with open('stage07-pop05-evidence/receipts.txt','w') as receipts:
              receipts.write('exact_head='+Path('stage07-pop05-evidence/source-sha.txt').read_text().strip()+'\n')
              for test in sorted(expected):
                  receipts.write('native_original_ctest_pass='+test+'\n')
              for name in ('galaxy_wo2_industry_workforce_tests',
                           'v59_medical_recovery','galaxy_dock03_physical_workforce_tests'):
                  exe=next(p for p in Path('build/stage07-pop05').rglob(name+'*')
                           if p.is_file() and p.suffix in ('','.exe'))
                  receipts.write('executable_sha256:'+name+'='+hashlib.sha256(exe.read_bytes()).hexdigest()+'\n')
              receipts.write('installed_physical_acceptance=not_run\n')
          PY
      - name: Retain original exact-source native and SQLite recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage07-pop05-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            stage07-pop05-evidence/
            build/stage07-pop05/Testing/Temporary/LastTest.log
            build/stage07-pop05/Testing/Temporary/LastTestsFailed.log
          retention-days: 21
