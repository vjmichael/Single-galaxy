name: WORK-01A universal NPC work fulfillment and v94 recovery

on:
  pull_request:
    paths:
      - 'include/galaxy/Simulation.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'src/colony_live_host.cpp'
      - 'live/interactive_relay.py'
      - 'viewer/colony.js'
      - 'tests/WORK01A_UniversalFulfillmentTests.cpp'
      - 'tests/PLAY13D_PlanetSurveyNodeTests.js'
      - 'tests/PLAY13D_PlanetSurveyRelayTests.py'
      - 'tests/SHIP01D_FleetHostTests.py'
      - 'CMakeLists.txt'
      - '.github/workflows/work01a-universal-fulfillment.yml'
  workflow_dispatch:

jobs:
  native-universal-fulfillment:
    name: Two-owner work fulfillment, v94 SQLite and native regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux SQLite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Windows SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw 'No Windows vcpkg' }
          & $vcpkg install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'Native SQLite install failed' }
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows configure failed' }
      - name: Compile original simulation and new work adapter
        run: cmake --build build --parallel 2 --config Release --target galaxy_work01a_universal_fulfillment_tests galaxy_ship01f_customer_shipyard_tests galaxy_ship01b2_commission_freighter_tests galaxy_ship01d_fleet_selection_tests
      - name: Confirm real resource conservation, authorization and restart
        run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_(work01a_universal_fulfillment|ship01f_customer_shipyard|ship01b2_commission_freighter|ship01d_fleet_selection)$"

  authenticated-host-and-work-ui:
    name: Native host, strict HTTP and all work receipt types (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux SQLite SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Compile real physical simulation host
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          cmake --build build --parallel 2 --target galaxy_colony_live_host
      - name: Validate strict owner-scoped native work submission
        run: python tests/SHIP01D_FleetHostTests.py --host build/galaxy_colony_live_host
      - name: Validate origin, CSRF, exact typed NPC delegation and status
        run: python tests/PLAY13D_PlanetSurveyRelayTests.py --host build/galaxy_colony_live_host --relay live/interactive_relay.py
      - name: Validate read-only typed work states and durable directive receipts
        run: node --test tests/PLAY13D_PlanetSurveyNodeTests.js
