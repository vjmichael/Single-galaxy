name: FLIGHT-06 guardian and child physical rescue
on:
  pull_request:
    paths:
      - 'tests/FLIGHT06_DependentRendezvousRescueTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/flight06-dependent-rescue.yml'
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg SQLite failed' }
      - if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tc=Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$tc" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
      - run: cmake --build build --config Release --parallel 2 --target galaxy_flight06_dependent_rendezvous_tests galaxy_flight05_physical_rescue_tests v59_dependent_rescue
      - run: ctest --test-dir build -C Release --output-on-failure -R "^(galaxy_flight06_dependent_rendezvous|galaxy_flight05_physical_rescue|v59_dependent_rescue)$"
