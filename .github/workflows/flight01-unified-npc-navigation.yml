name: FLIGHT-01 unified mission-neutral NPC flight navigation

on:
  pull_request:
    paths:
      - 'include/galaxy/Simulation.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'tests/PLAY13D_RegionalFacilitiesTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/flight01-unified-npc-navigation.yml'
  workflow_dispatch:

jobs:
  native-npc-navigation:
    name: One native NPC flight service, physical transit and recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite native SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Install SQLite native SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw 'Missing Windows vcpkg' }
          & $vcpkg install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'SQLite install failed' }
      - name: Configure Linux C++/SQLite
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Configure Windows C++/SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Windows native configuration failed' }
      - name: Build generic flight, real freight and inherited owner authorization gates
        run: cmake --build build --parallel 2 --config Release --target galaxy_play13d_regional_facilities_tests galaxy_work01a_universal_fulfillment_tests galaxy_work01b_work_planner_tests galaxy_work01b2_native_capacity_tests galaxy_work01b3_emergency_fairness_tests galaxy_colony_auto04a_tests
      - name: Verify native physical flight, custody, negative tamper and SQLite replay
        run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_(flight01_unified_npc_navigation|work01c_native_transport_executors|work01a_universal_fulfillment|work01b_work_planner|work01b2_native_capacity|work01b3_emergency_fairness|colony_auto04a_safety)$"
