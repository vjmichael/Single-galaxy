name: SHIP-01B.2 native freighter commissioning acceptance

on:
  pull_request:
    paths:
      - 'include/galaxy/Simulation.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'src/colony_live_host.cpp'
      - 'live/interactive_relay.py'
      - 'viewer/colony.js'
      - 'tests/SHIP01B2_CommissionFreighterTests.cpp'
      - 'tests/SHIP01B_FirstFreighterTests.cpp'
      - 'tests/SHIP01A_ConstructionTests.cpp'
      - 'tests/PLAY13D_PlanetSurveyNodeTests.js'
      - 'tests/PLAY13D_PlanetSurveyRelayTests.py'
      - 'CMakeLists.txt'
      - '.github/workflows/ship01b2-native-commissioning.yml'
  workflow_dispatch:

jobs:
  freighter-native:
    name: Commissioning native and SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system SQLite SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Install SQLite SDK through vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) { throw "vcpkg not present at VCPKG_INSTALLATION_ROOT" }
          & $vcpkg install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "Failed to install SQLite SDK" }
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Compile physical shipyard, hull and commissioning tests
        run: cmake --build build --config Release --parallel 2 --target galaxy_ship01a_preflight_tests galaxy_ship01a_construction_tests galaxy_ship01b_first_freighter_tests galaxy_ship01b2_commission_freighter_tests
      - name: Execute exact-head native SQLite/failpoint acceptance
        run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_ship01(a_preflight|a_construction|b_first_freighter|b2_commission_freighter)$"

  freighter-ui-relay:
    name: Commissioning host, HTTP relay and browser contract (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system SQLite SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Configure and build real native host
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          cmake --build build --parallel 2 --target galaxy_colony_live_host
      - name: Real native host and HTTP relay exact-action matrix
        run: python tests/PLAY13D_PlanetSurveyRelayTests.py --host build/galaxy_colony_live_host --relay live/interactive_relay.py
      - name: Browser telemetry and malformed receipt regression
        run: node --test tests/PLAY13D_PlanetSurveyNodeTests.js
