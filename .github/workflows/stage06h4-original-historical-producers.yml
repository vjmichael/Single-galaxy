name: S6-H4 authentic historical SQLite source producers
# Source-authenticated history only; no physical PC, install, release, Radeon.
on:
  push:
    branches: [sg/stage6f5e-installed-terrain-recovery-20261112]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage06h4-original-native-producers
  cancel-in-progress: true
jobs:
  original-producers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - era: pre-v109-original-v92
            source_sha: 23bad9be38936d61b8c29b5be5f3900bec87fa6d
            targets: galaxy_play13d_regional_facilities_tests
            test_regex: '^(galaxy_play13d_regional_facilities|galaxy_ship01c_manufactured_freight)$'
          - era: v111-planet-housing
            source_sha: 44619e9b186f99fa836ae9494a88137f3f2bf3f5
            targets: 'galaxy_wo3_planetary_housing_tests galaxy_wo3_planetary_utility_tests'
            test_regex: '^galaxy_wo3_planetary_(housing|utility)$'
          - era: v118-family-custody
            source_sha: d47e5cdb0532b615ffc99ffce23358a92ab05724
            targets: 'galaxy_wo3_planetary_housing_tests galaxy_wo3_planetary_utility_tests'
            test_regex: '^galaxy_wo3_planetary_(housing|utility)$'
          - era: v128-planetary-resource
            source_sha: eb448b6735a6e90b20480b3ac5065e06f30ae1ad
            targets: 'galaxy_stage06_finite_planet_genesis_tests galaxy_stage06_seasonal_environment_tests'
            test_regex: '^galaxy_stage06_(finite_planet_genesis|seasonal_environment)$'
          - era: v135-medical-atmosphere
            source_sha: 8ccb4a37b76e6e1510ee3fa1751fc23a9cdbc685
            targets: 'galaxy_stage06_physical_environment_tests galaxy_stage06_finite_planet_genesis_tests galaxy_stage06_ecology_industry_tests'
            test_regex: '^galaxy_stage06_(physical_environment|finite_planet_genesis|ecology_industry)$'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source and historical original commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git cat-file -e '${{ matrix.source_sha }}^{commit}'
          mkdir -p original-evidence
          git worktree add --detach ../historical-native-${{ matrix.era }} '${{ matrix.source_sha }}'
          HIST="$(realpath ../historical-native-${{ matrix.era }})"
          test "$(git -C "$HIST" rev-parse HEAD)" = '${{ matrix.source_sha }}'
          test -z "$(git -C "$HIST" status --porcelain --untracked-files=no)"
          echo '${{ matrix.source_sha }}' > original-evidence/historical-source-sha.txt
          echo "$GITHUB_SHA" > original-evidence/observer-source-sha.txt
      - name: Compile original native game and independent observer
        shell: bash
        run: |
          set -euo pipefail
          HIST="$(realpath ../historical-native-${{ matrix.era }})"
          cc -std=c11 -fPIC -shared -Wall -Wextra -Werror \
             -o original-evidence/libsg_h4_observer.so \
             tools/history/SQLiteCommitObserver.c -ldl -lsqlite3
          # The original WO3 source contains two CMake-invalid comment lines.
          # Generate a CMake-only compatibility file OUTSIDE its Git worktree,
          # retaining every original source/test/kernel byte unchanged.
          SOURCE="$HIST"
          if grep -q '^// WO3-A: proposal-only' "$HIST/CMakeLists.txt"; then
            ADAPTER="$PWD/original-evidence/source-adapter"
            python3 - "$HIST" "$ADAPTER" <<'PYADAPTER'
          import pathlib,sys
          historic=pathlib.Path(sys.argv[1])
          target=pathlib.Path(sys.argv[2])
          target.mkdir(parents=True,exist_ok=False)
          original=(historic/'CMakeLists.txt').read_text()
          wrong=['// WO3-A: proposal-only colony construction planning and original-world actual',
                 '// facility, census, utility, immutable SQLite copies and material conservation.']
          for line in wrong:
              if original.count(line)!=1:raise RuntimeError('unexpected historical CMake source')
          repaired=original
          for line in wrong:repaired=repaired.replace(line,'#'+line[2:])
          (target/'CMakeLists.txt').write_text(repaired)
          for entry in historic.iterdir():
              if entry.name!='CMakeLists.txt':
                  (target/entry.name).symlink_to(entry.resolve(),target_is_directory=entry.is_dir())
          print('Verified unmodified original C++ with shadow-only CMake parse adapter')
          PYADAPTER
            SOURCE="$ADAPTER"
            sha256sum "$HIST/CMakeLists.txt" "$SOURCE/CMakeLists.txt" \
               > original-evidence/cmake-adapter-provenance.sha256
          fi
          cmake -S "$SOURCE" -B original-evidence/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 2>&1 \
            | tee original-evidence/original-cmake-configure.log
          cmake --build original-evidence/build --parallel 3 --target ${{ matrix.targets }} \
            2>&1 | tee original-evidence/original-native-build.log
          test -z "$(git -C "$HIST" status --porcelain --untracked-files=no)"
      - name: Run untouched native CTests and observe only real committed SQLite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-evidence/sqlite
          export SG_H4_CAPTURE_DIR="$PWD/original-evidence/sqlite"
          export SG_H4_CAPTURE_VERSIONS='86-135'
          export LD_PRELOAD="$PWD/original-evidence/libsg_h4_observer.so"
          ctest --test-dir original-evidence/build -N -R '${{ matrix.test_regex }}' \
            | tee original-evidence/ctest-discovery.txt
          grep -q 'Total Tests:' original-evidence/ctest-discovery.txt
          if grep -q 'Total Tests: 0' original-evidence/ctest-discovery.txt; then
            echo 'No historical CTests selected' >&2; exit 1
          fi
          ctest --test-dir original-evidence/build --output-on-failure \
            --output-junit "$PWD/original-evidence/original-native-tests.xml" \
            -j 1 -R '${{ matrix.test_regex }}' 2>&1 \
            | tee original-evidence/native-original.log
          test "${PIPESTATUS[0]}" = 0
          unset LD_PRELOAD
      - name: Independently verify historical native SQLite and executable identity
        shell: bash
        run: |
          set -euo pipefail
          HIST="$(realpath ../historical-native-${{ matrix.era }})"
          test "$(git -C "$HIST" rev-parse HEAD)" = '${{ matrix.source_sha }}'
          test -z "$(git -C "$HIST" status --porcelain --untracked-files=no)"
          read -ra TARGETS <<< '${{ matrix.targets }}'
          EXE=()
          for target in "${TARGETS[@]}"; do
            test -x "original-evidence/build/$target"
            EXE+=("original-evidence/build/$target")
          done
          python tests/Stage06H4HistoricalNativeCorpus.py \
            --source-sha '${{ matrix.source_sha }}' --current-sha "$GITHUB_SHA" \
            --source-clean --capture-dir original-evidence/sqlite \
            --observer original-evidence/libsg_h4_observer.so \
            --output original-evidence/historical-corpus.json \
            --test-names '${{ matrix.test_regex }}' \
            --producer-executables "${EXE[@]}"
      - name: Independent modern canonical and WAL recovery of historical native SQLite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmake -S . -B original-evidence/current -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 2>&1 | tee original-evidence/modern-consumer-configure.log
          cmake --build original-evidence/current --parallel 3 --target galaxy_stage06h4_historical_recovery_tests 2>&1 | tee original-evidence/modern-consumer-build.log
          python3 tests/Stage06H4NativeCompatibility.py \
            --manifest original-evidence/historical-corpus.json \
            --capture-dir original-evidence/sqlite \
            --source-sha '${{ matrix.source_sha }}' \
            --consumer original-evidence/current/galaxy_stage06h4_historical_recovery_tests \
            --executed-tests-successful \
            --output original-evidence/vintage-to-current-recovery.json
      - name: Retain original historical SQLite, manifests, failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage06h4-original-${{ matrix.era }}-${{ github.sha }}
          path: |
            original-evidence/historical-source-sha.txt
            original-evidence/observer-source-sha.txt
            original-evidence/historical-corpus.json
            original-evidence/vintage-to-current-recovery.json
            original-evidence/modern-consumer-configure.log
            original-evidence/modern-consumer-build.log
            original-evidence/sqlite/*.sqlite
            original-evidence/native-original.log
            original-evidence/original-native-tests.xml
            original-evidence/ctest-discovery.txt
            original-evidence/original-cmake-configure.log
            original-evidence/original-native-build.log
            original-evidence/cmake-adapter-provenance.sha256
          if-no-files-found: warn
          retention-days: 21
