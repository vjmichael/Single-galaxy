name: Colony AUTO-04D5A autonomous NPC emergency response
on:
  push:
    branches:
      - integration/colony-auto04d5a-npc-emergency-dispatch-v78-20261103
  pull_request:
    paths:
      - 'src/Persistence.cpp'
      - 'include/galaxy/Persistence.hpp'
      - 'tests/COLONY_AUTO04D5A_*'
      - 'CMakeLists.txt'
  workflow_dispatch:
jobs:
  autonomous-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Build real native, household and NPC emergency tests
        run: cmake --build build --target galaxy_colony_auto04d5a_autonomous_emergency_tests galaxy_colony_auto04d4d2c_mixed_guardians_tests galaxy_colony_auto04d4d2b2_atomic_family_tests -j 2
      - name: Test real SQLite and host-autonomous emergency acceptance
        run: ctest --test-dir build --output-on-failure -R 'galaxy_colony_auto04(d5a_autonomous_emergency|d4d2c_mixed_guardians|d4d2b2_atomic_family)'
