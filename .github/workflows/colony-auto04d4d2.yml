name: Colony 04D4D2 physical family custody
on:
  push:
    branches:
      - integration/colony-auto04d4d2-physical-family-v74-20261103
      - integration/colony-auto04d4d2b-predecessor-pin-v75-20261103
  pull_request:
    paths:
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'src/ColonySafety.cpp'
      - 'include/galaxy/Simulation.hpp'
      - 'tests/COLONY_AUTO04D4D2_*'
      - 'CMakeLists.txt'
  workflow_dispatch:
jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --target galaxy_colony_auto04d4d2_physical_tests galaxy_colony_auto04d4d2_atomic_tests galaxy_colony_auto04d4d_family_tests galaxy_colony_auto04d4c_departure_tests galaxy_colony_auto04d4c_staffed_tests galaxy_colony_auto04d4_custody_tests galaxy_colony_auto04d3_tests -j 2
      - name: Run
        run: ctest --test-dir build --output-on-failure -R 'galaxy_colony_auto04(d3_npc_notice|d4_resource_custody|d4c_atomic_departure|d4c_staffed_colony|d4d_family_proof|d4d2_physical_family|d4d2_atomic_family)'
