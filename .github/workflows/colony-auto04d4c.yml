name: Colony AUTO-04D4C atomic departure
on:
  push:
    branches:
      - integration/colony-auto04d4c-atomic-departure-v72-20261103
  pull_request:
    paths:
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'include/galaxy/Simulation.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'tests/COLONY_AUTO04D4C_*'
      - 'CMakeLists.txt'
  workflow_dispatch:
jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --target galaxy_colony_auto04a_tests galaxy_colony_auto04b_host_tests galaxy_colony_auto04d2_tests galaxy_colony_auto04d3_tests galaxy_colony_auto04d3_repair_tests galaxy_colony_auto04d3_ferry_tests galaxy_colony_auto04d4_custody_tests galaxy_colony_auto04d4_manifest_tests galaxy_colony_auto04d4c_departure_tests galaxy_colony_auto04d4c_staffed_tests galaxy_b70h_delegated_maintenance_tests galaxy_colony_live_host galaxy_shipping_status_bridge -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -R 'galaxy_colony_auto04(a_safety|b_host|b_authenticated_relay|d2_durable_response|d3_npc_notice|d3_physical_repair|d3_ferry_rescue|d4_resource_custody|d4_departure_manifest|d4c_atomic_departure|d4c_staffed_colony)|galaxy_b70h_delegated_maintenance_tests'
