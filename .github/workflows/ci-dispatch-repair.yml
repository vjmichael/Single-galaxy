name: CI task-group dispatch — superseded native repair

# Github did not schedule the 2026-11-09 request-file push even though the
# default-branch group workflow is active. This one-shot maintenance bootstrap
# uses the explicit workflow_dispatch API. It is NOT a game CI test.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ci-dispatch-repair.yml']

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: sg-ci-one-time-dispatch-repair
  cancel-in-progress: false

jobs:
  dispatch:
    name: Verify owner request and dispatch one exact-head SGDX03 group
    if: github.repository == 'vjmichael/Single-galaxy'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deliberately dispatch the current exact-head group once
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const request = JSON.parse(fs.readFileSync('ci/task-group-request.json','utf8'));
            if (request.schema !== 'SG-CI-GATE-01' ||
                request.task_group !== 'SGDX03' ||
                request.pr_number !== 125 ||
                !/^[0-9a-f]{40}$/.test(request.source_sha))
              throw new Error('Task-group request is absent, mutated or malformed');
            const {data: pr} = await github.rest.pulls.get({
              owner,repo,pull_number:125
            });
            if (pr.state !== 'open' || pr.head.repo.full_name !== owner+'/'+repo ||
                pr.head.sha !== request.source_sha)
              throw new Error('Current PR head is not the requested exact SHA');
            const {data: workflow} = await github.rest.actions.getWorkflow({
              owner,repo,workflow_id:'ci-task-group-acceptance.yml'
            });
            if(workflow.path !== '.github/workflows/ci-task-group-acceptance.yml' ||
               workflow.state !== 'active')
              throw new Error('Expected default-branch task-group gate active: '+workflow.state);
            // Exactly one authorized replacement: old PR head 71917aa9
            // was superseded by a single repair commit after 17/17 native
            // local Linux regressions passed. Never cancel any assigned job
            // or actual running test. Check exact GitHub state first.
            const supersededId=42663279182;
            const {data: existing} = await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:workflow.id,event:'workflow_dispatch',
              per_page:30
            });
            const newOnes=existing.workflow_runs.filter(r=>
              r.id!==supersededId && r.created_at>='2026-11-09T17:18:00Z');
            if(newOnes.length)
              throw new Error('Other group dispatch exists: '+newOnes.map(r=>r.id).join(','));
            const {data: old}=await github.rest.actions.getWorkflowRun({
              owner,repo,run_id:supersededId
            });
            if(old.head_sha==='')throw new Error('Missing old head SHA');
            if(old.status==='queued'){
              const {data: oldJobs}=await github.rest.actions.listJobsForWorkflowRun({
                owner,repo,run_id:supersededId,per_page:30
              });
              if(oldJobs.jobs.some(j=>j.status!=='queued' ||
                   (j.runner_id && j.runner_id!==0) || j.started_at))
                throw new Error('Refuse to cancel a job with an assigned runner');
              await github.rest.actions.cancelWorkflowRun({
                owner,repo,run_id:supersededId
              });
              core.info('Cancellation requested for superseded queued run '+supersededId);
            }else if(old.status!=='completed' || old.conclusion!=='cancelled'){
              throw new Error('Old gate started or completed without cancellation: '+old.status);
            }
            // The cancel endpoint is asynchronous; require observable
            // cancellation before scheduling the one corrected SHA run.
            let canceled=false;
            for(let n=0;n<25;n++){
              const {data: confirm}=await github.rest.actions.getWorkflowRun({
                owner,repo,run_id:supersededId
              });
              if(confirm.status==='completed' && confirm.conclusion==='cancelled'){
                canceled=true;break;
              }
              if(confirm.status!=='queued' && confirm.status!=='in_progress')
                throw new Error('Unrecognized old gate status '+confirm.status);
              await new Promise(resolve=>setTimeout(resolve,1200));
            }
            if(!canceled)throw new Error('Old gate cancellation not yet independently confirmed; no replacement dispatched');
            // Re-check new dispatch history before sending exactly one.
            const {data: recheck}=await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:workflow.id,event:'workflow_dispatch',per_page:30
            });
            if(recheck.workflow_runs.some(r=>
              r.id!==supersededId && r.created_at>='2026-11-09T17:18:00Z'))
              throw new Error('Another dispatch appeared during cancellation');
            const started_at=new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({
              owner,repo,workflow_id:workflow.id,ref:'main',
              inputs:{
                task_group:'SGDX03',
                pr_number:'125',
                source_sha:request.source_sha
              }
            });
            core.info('TASK-GROUP DISPATCH API SUCCESS: SGDX03 PR #125 '+request.source_sha);
            await core.summary.addHeading('Native SGDX03 exact-head group dispatch')
              .addTable([
                [{data:'Field',header:true},{data:'Exact value',header:true}],
                ['Dispatch API','ACCEPTED; await separate workflow-run registration'],
                ['Workflow ID',String(workflow.id)],
                ['PR','#125'],
                ['Source SHA',request.source_sha],
                ['Maintenance run',String(context.runId)],
                ['Request UTC',started_at]
              ]).write();
