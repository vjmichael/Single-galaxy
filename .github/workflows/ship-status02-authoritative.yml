name: SHIP-STATUS-02 authoritative module execution and recovery
on:
  pull_request:
    paths:
      - 'include/galaxy/ShipStatusEffects.hpp'
      - 'include/galaxy/ShipStatusFitting.hpp'
      - 'include/galaxy/Simulation.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'tests/SHIPSTATUS02_AuthoritativePersistenceTests.cpp'
      - 'tests/SHIPSTATUS03_PhysicalHackingTests.cpp'
      - 'tests/SHIPSTATUS04_NpcCyberTacticsTests.cpp'
      - 'tests/SHIPSTATUS05_SupervisorTests.cpp'
      - 'tests/SHIPSTATUS06_FleetCyberTests.cpp'
      - 'tests/SHIPSTATUS07_CyberIncidentJournalTests.cpp'
      - 'tests/SHIPSTATUS07_StealthSensorTests.cpp'
      - 'tests/SHIPSTATUS07_ViewPrivacyTests.cpp'
      - 'src/ClientContract.cpp'
      - 'tests/ClientContractTests.cpp'
      - 'include/galaxy/ShipSensorProfile.hpp'
      - 'include/galaxy/CyberSecurityResponse.hpp'
      - 'src/ColonyDefense.cpp'
      - 'include/galaxy/CyberIncidentJournal.hpp'
      - 'src/CyberIncidentJournal.cpp'
      - 'tests/SHIPSTATUS06_LiveCyberHostTests.py'
      - 'tests/SHIPSTATUS06_InstalledBrowserTests.py'
      - 'tests/SHIPSTATUS05_CyberCockpitTests.js'
      - 'include/galaxy/NpcCyberSupervisor.hpp'
      - 'src/colony_live_host.cpp'
      - 'viewer/cyber-controls.js'
      - 'viewer/interactive.html'
      - 'viewer/interactive.js'
      - 'live/interactive_relay.py'
      - 'tests/SHIPSTATUS05_CyberRelayTests.py'
      - 'include/galaxy/TerritorialCyberEvidence.hpp'
      - 'include/galaxy/NpcCyberTactics.hpp'
      - 'src/ColonyConflict.cpp'
      - 'tests/SHIPSTATUS01_ConfusionTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/ship-status02-authoritative.yml'
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'SQLite SDK installation failed' }
      - if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tc=Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$tc" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'native configuration failed' }
      - run: cmake --build build --config Release --parallel 2 --target galaxy_client_contract_tests galaxy_ship_status07_view_privacy_tests galaxy_ship_status07_sensor_tests galaxy_ship_status07_incident_tests galaxy_ship_status06_fleet_cyber_tests galaxy_ship_status05_supervisor_tests galaxy_colony_live_host galaxy_shipping_status_bridge galaxy_ship_status04_npc_cyber_tests galaxy_ship_status03_physical_hacking_tests galaxy_ship_status02_authoritative_tests galaxy_ship_status01_confusion_tests galaxy_play10_exploration_tests
      - run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_(ship_status(01_confusion|02_authoritative|03_physical_hacking|04_npc_cyber|05_supervisor|05_cockpit|06_fleet_cyber|06_live_cyber|07_incident|07_sensors|07_view_privacy)|play10_exploration|kernel_tests|client_contract_tests)$"
      - name: Verify live relay and cockpit syntax
        shell: bash
        run: |
          node --check viewer/cyber-controls.js
          node --check viewer/interactive.js
          python -m py_compile live/interactive_relay.py
          python tests/SHIPSTATUS05_CyberRelayTests.py
          python -m py_compile tests/SHIPSTATUS06_LiveCyberHostTests.py tests/SHIPSTATUS06_InstalledBrowserTests.py
          node tests/SHIPSTATUS05_CyberCockpitTests.js
      - name: Real Chromium installed-game browser smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/SHIPSTATUS06_InstalledBrowserTests.py \
            --host build/galaxy_colony_live_host \
            --relay live/interactive_relay.py \
            --bridge build/galaxy_shipping_status_bridge
