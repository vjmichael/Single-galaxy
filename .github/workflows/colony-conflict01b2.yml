name: Colony CONFLICT-01B2 dated diplomatic intent
on:
  push:
    branches:
      - integration/colony-conflict01b2-diplomacy-epoch-v84-20261103
  pull_request:
    paths:
      - 'src/ColonyConflict.cpp'
      - 'include/galaxy/ColonyConflict.hpp'
      - 'src/Persistence.cpp'
      - 'include/galaxy/Persistence.hpp'
      - 'tests/COLONY_CONFLICT01B*'
      - 'CMakeLists.txt'
  workflow_dispatch:
jobs:
  epoch-fenced-npc-intent-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Build native physical, grievance and diplomatic epoch tests
        run: cmake --build build --target galaxy_colony_conflict01b2_diplomacy_epoch_tests galaxy_colony_conflict01b1_grievance_tests galaxy_colony_conflict01a_aggressive_intent_tests galaxy_colony_defense01a_watch_tests -j 2
      - name: Test durable source-backed intent, restart and tamper checks
        run: ctest --test-dir build --output-on-failure -R 'galaxy_colony_(conflict01b2_diplomacy_epoch|conflict01b1_grievance|conflict01a_aggressive_intent|defense01a_local_watch)'
