name: Group3-A native manufactured drill and finite mined ore exact-head
on:
  push:
    branches: [sg/group3-mining-industry-20261111]
    paths: [".github/workflows/group3-native.yml", "src/**", "include/**", "tests/**", "CMakeLists.txt"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group3-native:
    name: Group3-A ${{ matrix.os }} original SQLite module/mass custody
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and accepted ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b5d7057928d87d3cb1a05e07ff1d784a9425ad5f "$GITHUB_SHA"
          git log -1 --format='GROUP3 PINNED SOURCE: %H %s'
      - name: Install original SQLite on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev ninja-build
      - name: Install original SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:VCPKG_INSTALLATION_ROOT
          if(-not $root){$root='C:\vcpkg'}
          & (Join-Path $root 'vcpkg.exe') install sqlite3:x64-windows --classic
          if($LASTEXITCODE -ne 0){throw 'SQLite install failure'}
          "SG_VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "SG_TOOLCHAIN=$(Join-Path $root 'scripts\buildsystems\vcpkg.cmake')" >> $env:GITHUB_ENV
          (Join-Path $root 'installed\x64-windows\bin') >> $env:GITHUB_PATH
      - name: Configure + compile true native kernel and regression (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/group3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          cmake --build build/group3 --parallel 2 --target galaxy_group3_fitted_mining_tests
      - name: Configure + compile true native kernel and regression (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/group3 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF "-DCMAKE_TOOLCHAIN_FILE=$env:SG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows
          if($LASTEXITCODE -ne 0){throw 'MSVC configuration failure'}
          cmake --build build/group3 --config Release --parallel 2 --target galaxy_group3_fitted_mining_tests
          if($LASTEXITCODE -ne 0){throw 'MSVC compilation failure'}
      - name: Real SQLite module fitting finite mining and restart (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/group3 --no-tests=error -R '^galaxy_group3_original_fitted_mining$' --output-on-failure --output-junit group3-linux.xml --timeout 120
      - name: Real SQLite module fitting finite mining and restart (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build/group3 -C Release --no-tests=error -R '^galaxy_group3_original_fitted_mining$' --output-on-failure --output-junit group3-windows.xml --timeout 120
          if($LASTEXITCODE -ne 0){throw 'Original v126 module/ore conservation test failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group3-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/group3/Testing/Temporary/LastTest.log
            build/group3/group3-*.xml
          if-no-files-found: warn
