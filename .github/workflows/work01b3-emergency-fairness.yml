name: WORK-01B.3 emergency policy and fair native work scheduling

on:
  pull_request:
    paths:
      - 'include/galaxy/WorkPolicy.hpp'
      - 'include/galaxy/WorkPlanning.hpp'
      - 'include/galaxy/Simulation.hpp'
      - 'src/Simulation.cpp'
      - 'tests/WORK01B3_EmergencyFairnessTests.cpp'
      - 'tests/WORK01A_UniversalFulfillmentTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/work01b3-emergency-fairness.yml'
  workflow_dispatch:

jobs:
  native-policy-fairness:
    name: Canonical life-safety priority, eligible scheduling and recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux SQLite SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Windows SQLite SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw 'Missing Windows vcpkg' }
          & $vcpkg install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'Native SQLite install failed' }
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
      - name: Build original canonical kernel and focused regressions
        run: cmake --build build --parallel 2 --config Release --target galaxy_work01b3_emergency_fairness_tests galaxy_work01b2_native_capacity_tests galaxy_work01b_work_planner_tests galaxy_work01a_universal_fulfillment_tests galaxy_ship01f_customer_shipyard_tests galaxy_ship01b2_commission_freighter_tests galaxy_ship01a_construction_tests galaxy_colony_auto04a_tests
      - name: Run life safety, fair queue, funded ship and v94 crash/recovery gates
        run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_(work01b3_emergency_fairness|work01b2_native_capacity|work01b_work_planner|work01a_universal_fulfillment|ship01f_customer_shipyard|ship01b2_commission_freighter|ship01a_construction|colony_auto04a_safety)$"
