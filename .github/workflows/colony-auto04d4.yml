name: Colony AUTO-04D4 physical resource custody
on:
  push:
    branches:
      - integration/colony-auto04d4-resource-custody-v71-20261103
  pull_request:
    paths:
      - 'src/Simulation.cpp'
      - 'src/ColonySafety.cpp'
      - 'src/Persistence.cpp'
      - 'tests/COLONY_AUTO04D4_*'
      - 'tests/COLONY_AUTO04D3_FerryRescueTests.cpp'
      - 'CMakeLists.txt'
  workflow_dispatch:
jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native requirements
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: CMake configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Build focused colony and safety tests
        run: cmake --build build --target galaxy_colony_auto04a_tests galaxy_colony_auto04b_host_tests galaxy_colony_auto04d2_tests galaxy_colony_auto04d3_tests galaxy_colony_auto04d3_repair_tests galaxy_colony_auto04d3_ferry_tests galaxy_colony_auto04d4_custody_tests galaxy_colony_auto04d4_manifest_tests galaxy_b70h_delegated_maintenance_tests galaxy_colony_live_host galaxy_shipping_status_bridge -j 2
      - name: Run focused physical world and relay acceptance
        run: ctest --test-dir build --output-on-failure -R 'galaxy_colony_auto04(a_safety|b_host|b_authenticated_relay|d2_durable_response|d3_npc_notice|d3_physical_repair|d3_ferry_rescue|d4_resource_custody|d4_departure_manifest)|galaxy_b70h_delegated_maintenance_tests'
