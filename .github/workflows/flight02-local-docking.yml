name: FLIGHT-02 shared local NPC approach and docking

on:
  pull_request:
    paths:
      - 'include/galaxy/Simulation.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'tests/FLIGHT02_LocalDockingTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/flight02-local-docking.yml'
  workflow_dispatch:

jobs:
  native-local-docking:
    name: One shared NPC approach/docking, real ship commands and replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Native SQLite SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Native SQLite SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw 'Missing Windows vcpkg' }
          & $vcpkg install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'SQLite SDK installation failed' }
      - name: Configure native Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Configure native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Windows configuration failed' }
      - name: Compile original navigation, shared NPC control and prior flight gates
        run: cmake --build build --parallel 2 --config Release --target galaxy_flight02_local_docking_tests galaxy_navigation_tests galaxy_play13d_regional_facilities_tests galaxy_work01b_work_planner_tests
      - name: Verify docking, prior celestial and local freight, replay and tamper checks
        run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_(flight02_local_docking|navigation|flight01_unified_npc_navigation|work01c_native_transport_executors|work01b_work_planner)$"
