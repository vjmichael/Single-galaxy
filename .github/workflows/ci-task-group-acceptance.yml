name: SG task-group acceptance — exact-head Windows and Linux

# One request per finished task group. Nothing runs on code commits or PR sync.
on:
  push:
    branches: [main]
    paths: ['ci/task-group-request.json']
  workflow_dispatch:
    inputs:
      task_group:
        description: 'Completed acceptance task group'
        required: true
        type: choice
        options: [SGDX03]
      pr_number:
        description: 'Same-repository PR number whose current head is to be accepted'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character current PR head SHA'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: write # only older same-workflow queued group cancellation

concurrency:
  group: sg-taskgroup-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Authenticate task-group request and pin exact current PR head
    runs-on: ubuntu-slim
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      group: ${{ steps.resolve.outputs.group }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Reject unstaged group, stale source SHA, or foreign PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const req = context.eventName === 'workflow_dispatch'
              ? {
                  task_group: context.payload.inputs.task_group,
                  source_sha: context.payload.inputs.source_sha,
                  pr_number: Number(context.payload.inputs.pr_number)
                }
              : JSON.parse(fs.readFileSync('ci/task-group-request.json', 'utf8'));
            if (req.schema && req.schema !== 'SG-CI-GATE-01')
              throw new Error('Unrecognized task-group request schema');
            if (req.task_group !== 'SGDX03')
              throw new Error('Only SGDX03 is configured; require explicit group gate review for other work');
            if (!Number.isSafeInteger(Number(req.pr_number)) || Number(req.pr_number) <= 0)
              throw new Error('Invalid PR number');
            if (!/^[0-9a-f]{40}$/.test(String(req.source_sha)))
              throw new Error('Expected exact 40-hex Git source SHA');
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(req.pr_number)
            });
            if (pr.state !== 'open' || pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo)
              throw new Error('Group accepts open same-repository PRs only');
            if (pr.head.sha !== req.source_sha)
              throw new Error('Stale/superseded PR head; requested ' + req.source_sha + ' current ' + pr.head.sha);
            core.setOutput('sha', req.source_sha);
            core.setOutput('group', req.task_group);
            core.setOutput('pr_number', String(req.pr_number));
            await core.summary.addHeading('Bounded task-group acceptance')
              .addTable([
                [{data:'Field',header:true},{data:'Exact value',header:true}],
                ['Task group', req.task_group],
                ['PR', '#' + req.pr_number],
                ['Source SHA', req.source_sha],
                ['Branch', pr.head.ref]
              ]).write();
            // One source-bound task-group run supersedes older QUEUED copies.
            // Never cancel running or unrelated workflows; no extra CI jobs.
            try {
              const older = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci-task-group-acceptance.yml',
                status: 'queued', per_page: 100
              });
              let cancelled = 0;
              for (const run of older.data.workflow_runs || []) {
                if (cancelled >= 20) break;
                if (run.id >= context.runId || run.status !== 'queued' ||
                    !['push','workflow_dispatch'].includes(run.event) ||
                    run.head_branch !== 'main') continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    ...context.repo, run_id: run.id
                  });
                  cancelled++;
                  core.info('Superseded SGDX03 queued run cancelled: ' + run.id);
                } catch (err) {
                  core.warning('Older run ' + run.id + ' cancellation failed: ' + err);
                }
              }
              core.info('Superseded queued SGDX03 cancellations requested: ' + cancelled);
            } catch (err) {
              core.warning('Queue hygiene unavailable; native acceptance remains necessary: ' + err);
            }

  linux-native:
    needs: validate
    name: Linux C++ 3D, SGDX custody, SQLite, live Godot
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile original C++, SGDX and fixture
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev ninja-build unzip
          cmake -S . -B build/fp3d-env01 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          cmake --build build/fp3d-env01 --parallel 2 --target \
            galaxy_fp3d_env01_swept_collision_tests \
            galaxy_play_station04a_original_asteroid_contact_tests \
            galaxy_fp3d03b_cockpit_flight_tests \
            galaxy_play_station_boarding_tests \
            galaxy_play_station03b_persistent_refinery_tests \
            galaxy_play_station_mining_refining_e2e \
            galaxy_play_station04a_native_rock_seed \
            galaxy_colony_live_host galaxy_interactive_host galaxy_native_cell_worker \
            galaxy_desktop_player_host galaxy_desktop_station_host galaxy_desktop_readonly_host \
            galaxy_server_dx_supervisor galaxy_server_dx_fault_child
      - name: Real C++ collision, SGDX full duplex, crash, forced termination and SQLite restart
        shell: bash
        run: |
          set -euxo pipefail
          python desktop_godot/tests/test_sgdx03_bridge_contract.py
          python desktop_godot/tests/test_fp3d_env01f_pilot_contract.py
          python desktop_godot/tests/test_fp3d_env01g_world_parity_contract.py
          python desktop_godot/tests/test_station_visual_contract.py
          ctest --test-dir build/fp3d-env01 --no-tests=error --timeout 200 \
            --output-on-failure --output-junit fp3d-env01-linux.xml \
            -R '^(galaxy_fp3d_env01_(swept_collision|native_collision_pipe)|galaxy_play_station04a_original_(asteroid_contact|rock_native_pipe)|galaxy_play_station_(boarding|mining_refining_e2e)|galaxy_play_station02_native_pipe|galaxy_play_station03(b_persistent_refinery|c_refinery_native_pipe)|galaxy_play_station04c_native_unload_pipe|galaxy_fp3d03b_(cockpit_flight|native_flight_pipe)|galaxy_sgdx03_godot_(native_bridge|source_admission)|galaxy_server_dx_(supervisor|sqlite_recovery|game_hosts)|galaxy_fp3d02b_native_desktop_readonly|galaxy_fp3d_win01_source_contract)$'
      - name: Real Godot 4.7.2 scene launches SGDX and the actual original C++ host
        timeout-minutes: 22
        shell: bash
        run: |
          set -euxo pipefail
          python desktop_godot/tests/test_native_asteroid_contact_contract.py
          mkdir -p "$RUNNER_TEMP/fp3d-godot" build/fp3d-env01/godot-logs desktop_godot/native
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 180 \
            -o "$RUNNER_TEMP/fp3d-godot/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          # Official godotengine/godot-builds 4.7.2-stable release asset digest.
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/fp3d-godot/godot.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/fp3d-godot/godot.zip" -d "$RUNNER_TEMP/fp3d-godot"
          G="$RUNNER_TEMP/fp3d-godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$G"
          "$G" --version
          timeout --signal=TERM --kill-after=8s 100s "$G" --headless --path desktop_godot --editor --quit \
            2>&1 | tee build/fp3d-env01/godot-logs/import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' build/fp3d-env01/godot-logs/import.log; then
            echo 'Godot 4.7.2 import has real GDScript parser errors' >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=8s 75s "$G" --headless --path desktop_godot --quit-after 5 \
            2>&1 | tee build/fp3d-env01/godot-logs/scene.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' build/fp3d-env01/godot-logs/scene.log; then
            echo 'Godot 4.7.2 actual scene has real GDScript errors' >&2
            exit 1
          fi
          cp build/fp3d-env01/galaxy_desktop_player_host \
            build/fp3d-env01/galaxy_desktop_station_host \
            build/fp3d-env01/galaxy_desktop_readonly_host \
            build/fp3d-env01/galaxy_server_dx_supervisor desktop_godot/native/
          printf '%s\n' '${{ needs.validate.outputs.sha }}' > desktop_godot/native/SGDX_BUILD_SHA.txt
          export SG_FP3D_E2E_SAVE="$RUNNER_TEMP/sgdx-live-original.sqlite"
          build/fp3d-env01/galaxy_play_station04a_native_rock_seed "$SG_FP3D_E2E_SAVE"
          timeout --signal=TERM --kill-after=8s 180s "$G" --headless --path desktop_godot --script res://tests/fp3d_env01_live_scene_acceptance.gd \
            2>&1 | tee build/fp3d-env01/godot-logs/real-sgdx-cockpit.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' build/fp3d-env01/godot-logs/real-sgdx-cockpit.log; then
            echo 'Godot 4.7.2 real native scene parser/runtime failure' >&2
            exit 1
          fi
          for test in native_player_protocol_smoke.gd native_asteroid_contact_smoke.gd native_station_protocol_smoke.gd native_station_refinery_protocol_smoke.gd station_visual_smoke.gd interaction_prompt_smoke.gd boarding_action_pipe_smoke.gd fp3d_env01_collision_receipt_smoke.gd fp3d_env01f_pilot_instruments_smoke.gd; do
            timeout --signal=TERM --kill-after=8s 90s "$G" --headless --path desktop_godot --script "res://tests/$test" \
              2>&1 | tee "build/fp3d-env01/godot-logs/$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "build/fp3d-env01/godot-logs/$test.log"; then
              echo "Real Godot parser/runtime failed for $test" >&2
              exit 1
            fi
          done
          # Fresh CI-only original-world sandbox. NO user data or arbitrary
          # demo reset. This is a real Godot -> SGDX -> C++/SQLite round trip:
          # launch station automatically, walk, E board, cockpit, reopen save.
          mkdir -p "$RUNNER_TEMP/fp3d-autostart-data"
          SG_FP3D_CI_AUTOSTART=1 XDG_DATA_HOME="$RUNNER_TEMP/fp3d-autostart-data" \
            timeout --signal=TERM --kill-after=8s 150s "$G" --headless --path desktop_godot \
            --script res://tests/auto_station_connect_acceptance.gd \
            2>&1 | tee build/fp3d-env01/godot-logs/auto_station_connect_acceptance.gd.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' build/fp3d-env01/godot-logs/auto_station_connect_acceptance.gd.log; then
            echo "Real automatic original station save/BOARD/reopen test failed" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp3d-sgdx-linux-${{ needs.validate.outputs.sha }}
          path: |
            fp3d-env01-linux.xml
            build/fp3d-env01/Testing/Temporary/LastTest.log
            build/fp3d-env01/godot-logs/*.log
            build/fp3d-env01/godot-logs/*.stderr
          if-no-files-found: warn
  windows-native:
    needs: validate
    name: Windows MSVC C++ 3D, SGDX Job Object, MDMP, live Godot
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Windows SQLite dependency
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vcpkg=$env:VCPKG_INSTALLATION_ROOT
          if(-not $vcpkg){$vcpkg='C:\vcpkg'}
          & (Join-Path $vcpkg 'vcpkg.exe') install sqlite3:x64-windows --classic
          if($LASTEXITCODE -ne 0){throw 'SQLite install failed'}
          "SG_VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
          "SG_TOOLCHAIN=$(Join-Path $vcpkg 'scripts\buildsystems\vcpkg.cmake')" >> $env:GITHUB_ENV
          (Join-Path $vcpkg 'installed\x64-windows\bin') >> $env:GITHUB_PATH
      - name: Compile original MSVC simulator and supervised hosts
        shell: pwsh
        run: |
          cmake -S . -B build/fp3d-env01 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF "-DCMAKE_TOOLCHAIN_FILE=$env:SG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows
          if($LASTEXITCODE -ne 0){throw 'MSVC configure failed'}
          cmake --build build/fp3d-env01 --config Release --parallel 2 --target galaxy_fp3d_env01_swept_collision_tests galaxy_play_station04a_original_asteroid_contact_tests galaxy_fp3d03b_cockpit_flight_tests galaxy_play_station_boarding_tests galaxy_play_station03b_persistent_refinery_tests galaxy_play_station_mining_refining_e2e galaxy_play_station04a_native_rock_seed galaxy_colony_live_host galaxy_interactive_host galaxy_native_cell_worker galaxy_desktop_player_host galaxy_desktop_station_host galaxy_desktop_readonly_host galaxy_server_dx_supervisor galaxy_server_dx_fault_child
          if($LASTEXITCODE -ne 0){throw 'MSVC native build failed'}
      - name: Real Windows SGDX pipe, crash/forced kill, SQLite and private minidump
        id: native-gate
        continue-on-error: true
        shell: pwsh
        run: |
          python desktop_godot/tests/test_sgdx03_bridge_contract.py
          python desktop_godot/tests/test_fp3d_env01f_pilot_contract.py
          python desktop_godot/tests/test_fp3d_env01g_world_parity_contract.py
          python desktop_godot/tests/test_station_visual_contract.py
          if($LASTEXITCODE -ne 0){throw 'Fail-closed source bridge check failed'}
          ctest --test-dir build/fp3d-env01 -C Release --no-tests=error --timeout 200 --output-on-failure --output-junit fp3d-env01-windows.xml -R '^(galaxy_fp3d_env01_(swept_collision|native_collision_pipe)|galaxy_play_station04a_original_(asteroid_contact|rock_native_pipe)|galaxy_play_station_(boarding|mining_refining_e2e)|galaxy_play_station02_native_pipe|galaxy_play_station03(b_persistent_refinery|c_refinery_native_pipe)|galaxy_play_station04c_native_unload_pipe|galaxy_fp3d03b_(cockpit_flight|native_flight_pipe)|galaxy_sgdx03_godot_(native_bridge|source_admission)|galaxy_server_dx_(supervisor|sqlite_recovery|game_hosts)|galaxy_fp3d02b_native_desktop_readonly|galaxy_fp3d_win01_source_contract)$'
          if($LASTEXITCODE -ne 0){throw 'Real native SGDX/SQLite/Windows MDMP gate failed'}
      - name: Windows Godot 4.7.2 real SGDX supervised cockpit, collision and camera
        id: godot-gate
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python desktop_godot/tests/test_native_asteroid_contact_contract.py
          if($LASTEXITCODE -ne 0){throw 'Native geometry contract failed'}
          New-Item -ItemType Directory -Force build/fp3d-env01/godot,build/fp3d-env01/godot-logs,desktop_godot/native | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile build/fp3d-env01/godot/editor.zip
          # Official godotengine/godot-builds 4.7.2-stable Windows release digest.
          if((Get-FileHash build/fp3d-env01/godot/editor.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'){throw 'Official Godot Windows download SHA256 mismatch'}
          Expand-Archive build/fp3d-env01/godot/editor.zip -DestinationPath build/fp3d-env01/godot -Force
          $g=Get-ChildItem build/fp3d-env01/godot -Filter '*win64_console.exe' -Recurse | Select-Object -First 1
          if(-not $g){$g=Get-ChildItem build/fp3d-env01/godot -Filter '*win64.exe' -Recurse | Select-Object -First 1}
          if(-not $g){throw 'Official Godot executable missing'}
          & $g.FullName --version
          if($LASTEXITCODE -ne 0){throw 'Godot version check failed'}
          # Hosted Windows Godot parser tests must not hang indefinitely after
          # an ERROR logged by the engine with an otherwise zero exit code.
          # Keep real process output intact for native incident review.
          function Invoke-BoundedGodot {
            param([string[]]$Arguments, [string]$Log, [int]$MaxSeconds)
            $errLog="$Log.stderr"
            $p=Start-Process -FilePath $g.FullName -ArgumentList $Arguments -PassThru -RedirectStandardOutput $Log -RedirectStandardError $errLog
            try {
              Wait-Process -Id $p.Id -Timeout $MaxSeconds -ErrorAction Stop
            } catch {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "Godot process timed out at $Log (limit $MaxSeconds seconds)"
            }
            $p.Refresh()
            $stdout=Get-Content -LiteralPath $Log -Raw -ErrorAction SilentlyContinue
            $stderr=Get-Content -LiteralPath $errLog -Raw -ErrorAction SilentlyContinue
            if($p.ExitCode -ne 0 -or ($stdout+$stderr) -match 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:'){
              # Exact native Windows errors used to be hidden because only
              # stdout (*.log), not *.log.stderr, was uploaded. Report both
              # (bounded to CI-only fixture output; never creator private data).
              if($stdout){Write-Host ("Godot stdout tail for "+$Log+": "+$stdout.Substring([Math]::Max(0,$stdout.Length-4000)))}
              if($stderr){Write-Host ("Godot stderr tail for "+$Log+": "+$stderr.Substring([Math]::Max(0,$stderr.Length-4000)))}
              throw "Real Godot native or GDScript parser failure at $Log (exit $($p.ExitCode))"
            }
          }
          Invoke-BoundedGodot -Arguments @('--headless','--path','desktop_godot','--editor','--quit') -Log 'build/fp3d-env01/godot-logs/import.log' -MaxSeconds 120
          Invoke-BoundedGodot -Arguments @('--headless','--path','desktop_godot','--quit-after','5') -Log 'build/fp3d-env01/godot-logs/scene.log' -MaxSeconds 75
          foreach($name in @('galaxy_desktop_player_host.exe','galaxy_desktop_station_host.exe','galaxy_desktop_readonly_host.exe','galaxy_server_dx_supervisor.exe')){
            Copy-Item (Join-Path 'build/fp3d-env01/Release' $name) desktop_godot/native -Force
          }
          Copy-Item (Join-Path $env:SG_VCPKG_ROOT 'installed\x64-windows\bin\sqlite3.dll') desktop_godot/native -Force
          '${{ needs.validate.outputs.sha }}' | Set-Content desktop_godot/native/SGDX_BUILD_SHA.txt
          $env:SG_FP3D_E2E_SAVE=(Join-Path (Resolve-Path build/fp3d-env01).Path 'sgdx-live-world.sqlite')
          & (Resolve-Path build/fp3d-env01/Release/galaxy_play_station04a_native_rock_seed.exe).Path $env:SG_FP3D_E2E_SAVE
          if($LASTEXITCODE -ne 0){throw 'Native finite-world fixture failed'}
          $env:SGDX_WINDOWS_MINIDUMP='1'
          Invoke-BoundedGodot -Arguments @('--headless','--path','desktop_godot','--script','res://tests/fp3d_env01_live_scene_acceptance.gd') -Log 'build/fp3d-env01/godot-logs/real-sgdx-cockpit.log' -MaxSeconds 180
          Remove-Item Env:SGDX_WINDOWS_MINIDUMP -ErrorAction SilentlyContinue
          foreach($test in @('native_player_protocol_smoke.gd','native_asteroid_contact_smoke.gd','native_station_protocol_smoke.gd','native_station_refinery_protocol_smoke.gd','station_visual_smoke.gd','interaction_prompt_smoke.gd','boarding_action_pipe_smoke.gd','fp3d_env01_collision_receipt_smoke.gd','fp3d_env01f_pilot_instruments_smoke.gd')){
            Invoke-BoundedGodot -Arguments @('--headless','--path','desktop_godot','--script',"res://tests/$test") -Log "build/fp3d-env01/godot-logs/$test.log" -MaxSeconds 75
          }
          # Genuine native gameplay on a fresh, isolated CI-only Godot
          # userdata directory. Do not touch a creator's existing SQLite.
          $oldAppData=$env:APPDATA
          $env:APPDATA=(Join-Path $env:RUNNER_TEMP 'fp3d-autostart-data')
          $env:SG_FP3D_CI_AUTOSTART='1'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          try {
            Invoke-BoundedGodot -Arguments @('--headless','--path','desktop_godot','--script','res://tests/auto_station_connect_acceptance.gd') -Log 'build/fp3d-env01/godot-logs/auto_station_connect_acceptance.gd.log' -MaxSeconds 150
          } finally {
            $env:APPDATA=$oldAppData
            Remove-Item Env:SG_FP3D_CI_AUTOSTART -ErrorAction SilentlyContinue
          }
      - name: Package only verified precompiled Windows SGDX game
        id: package-gate
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='build/SingleGalaxy_FP3D_SGDX03_Windows'
          $game=Join-Path $root 'desktop_godot'
          New-Item -ItemType Directory -Force $game | Out-Null
          Copy-Item desktop_godot/project.godot $game
          foreach($dir in @('world','tests','build_tools')){
            Copy-Item (Join-Path desktop_godot $dir) (Join-Path $game $dir) -Recurse -Force
          }
          Copy-Item desktop_godot/RUN_STATION_PLAYTEST_WINDOWS.cmd $game
          Copy-Item desktop_godot/START_SINGLE_GALAXY_WINDOWS.cmd (Join-Path $root 'START_SINGLE_GALAXY_WINDOWS.cmd')
          New-Item -ItemType Directory -Force (Join-Path $game 'native') | Out-Null
          foreach($name in @('galaxy_desktop_station_host.exe','galaxy_desktop_player_host.exe','galaxy_desktop_readonly_host.exe','galaxy_server_dx_supervisor.exe')){
            $compiled=Join-Path 'build/fp3d-env01/Release' $name
            if(-not(Test-Path $compiled)){throw "Compiled native host missing: $name"}
            Copy-Item $compiled (Join-Path $game 'native') -Force
          }
          Copy-Item (Join-Path $env:SG_VCPKG_ROOT 'installed\x64-windows\bin\sqlite3.dll') (Join-Path $game 'native') -Force
          $head='${{ needs.validate.outputs.sha }}'
          $head | Set-Content (Join-Path $game 'native/SGDX_BUILD_SHA.txt')
          "Exact source SHA: $head" | Set-Content (Join-Path $root 'SOURCE_SHA.txt')
          # Bundle the exact OFFICIAL engine already downloaded and verified
          # against upstream 4.7.2-stable release archive SHA256 above.
          # No separate installed editor, PATH lookup, net access or setup
          # is required on the physical player's Windows PC.
          $runtime=Join-Path $game 'runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $upstreamGodot=Join-Path 'build/fp3d-env01/godot' 'Godot_v4.7.2-stable_win64.exe'
          if(-not(Test-Path -LiteralPath $upstreamGodot -PathType Leaf)){
            throw 'Official Godot 4.7.2 Windows engine missing after verified release ZIP extraction'
          }
          $upstreamConsole=Join-Path 'build/fp3d-env01/godot' 'Godot_v4.7.2-stable_win64_console.exe'
          if(-not(Test-Path -LiteralPath $upstreamConsole -PathType Leaf)){
            throw 'Official Godot 4.7.2 Windows release missing native CLI console wrapper'
          }
          $runtimeGodot=Join-Path $runtime 'Godot_v4.7.2-stable_win64.exe'
          $runtimeConsole=Join-Path $runtime 'Godot_v4.7.2-stable_win64_console.exe'
          Copy-Item -LiteralPath $upstreamGodot -Destination $runtimeGodot -Force
          Copy-Item -LiteralPath $upstreamConsole -Destination $runtimeConsole -Force
          (Get-FileHash -LiteralPath $runtimeGodot -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath (Join-Path $runtime 'GODOT_RUNTIME_SHA256.txt') -NoNewline
          (Get-FileHash -LiteralPath $runtimeConsole -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath (Join-Path $runtime 'GODOT_CONSOLE_SHA256.txt') -NoNewline
          Copy-Item -LiteralPath 'desktop_godot/third_party/GODOT_LICENSE.txt' -Destination (Join-Path $runtime 'LICENSE.txt') -Force
          @(
            'Godot Engine 4.7.2-stable upstream redistribution'
            'Original asset: https://github.com/godotengine/godot-builds/releases/tag/4.7.2-stable'
            'Official Windows archive: Godot_v4.7.2-stable_win64.exe.zip'
            'Official archive SHA-256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
            'GUI executable SHA-256 is in GODOT_RUNTIME_SHA256.txt'
            'Official Windows CLI companion SHA-256 is in GODOT_CONSOLE_SHA256.txt'
            'Windows PowerShell 5.1 smoke uses console companion; game uses GUI executable'
            'License: MIT, see LICENSE.txt'
            'This editor binary is bundled only as the current native Godot 3D runtime.'
          ) | Set-Content -LiteralPath (Join-Path $runtime 'PROVENANCE.txt')
          'Double-click START_SINGLE_GALAXY_WINDOWS.cmd at the extracted ZIP root (or desktop_godot/RUN_STATION_PLAYTEST_WINDOWS.cmd). Includes pinned Godot 4.7.2 Windows runtime and original C++/SQLite hosts; no installation, compiler or download. All ship/station/observer hosts must use bundled SGDX supervisor and Windows Job Object. Optional crash minidump SGDX_WINDOWS_MINIDUMP=1 contains private memory. Human GPU/camera approval still required.' | Set-Content (Join-Path $root 'START_HERE.txt')
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath build/SingleGalaxy_FP3D_SGDX03_Windows_Precompiled.zip -Force
          # Validate the DELIVERABLE ZIP, then execute the unpacked artifact's
          # own included Godot, original scene, native hosts and headless smoke.
          # Source-tree tests alone cannot validate the player's packaged ZIP.
          $bundle='build/SingleGalaxy_FP3D_SGDX03_Windows_Precompiled.zip'
          & ./desktop_godot/build_tools/Verify-PrecompiledPackage.ps1 -Archive $bundle -ExpectedSourceSha $head -EvidenceFile 'build/fp3d-env01/godot-logs/packaging-result.json'
          $installed='build/fp3d-env01/installed-image'
          New-Item -ItemType Directory -Force $installed | Out-Null
          Expand-Archive -LiteralPath $bundle -DestinationPath $installed -Force
          $installedGame=Join-Path $installed 'desktop_godot'
          & (Join-Path $installedGame 'build_tools/Launch-PrebuiltStation.ps1') -VerifyOnly
          $resultPath=Join-Path $installedGame 'playtest-logs/result.json'
          if(-not(Test-Path -LiteralPath $resultPath -PathType Leaf)){
            throw 'Packaged self-contained launcher did not produce native/Godot result'
          }
          $report=Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if($report.result -cne 'BUNDLED-PACKAGE-HEADLESS-PREFLIGHT-VERIFIED-NO-GPU-CLAIM' -or
             $report.engine_mode -cne 'BUNDLED-VERIFIED' -or
             $report.build_sha -cne $head){
            throw 'Extracted Windows package failed exact-SHA native/bundled-engine smoke; no published ZIP allowed'
          }
          Copy-Item -LiteralPath $resultPath -Destination 'build/fp3d-env01/godot-logs/installed-package-preflight.json' -Force
          # Negative native Windows PowerShell 5.1 gate: mutate only the
          # extracted engine digest, require exact hash refusal, restore.
          & ./desktop_godot/build_tools/Test-BundledRuntimeTamper.ps1 -ExtractedGame $installedGame -EvidenceDirectory 'build/fp3d-env01/godot-logs'
      - uses: actions/upload-artifact@v4
        if: steps.native-gate.outcome == 'success' && steps.godot-gate.outcome == 'success' && steps.package-gate.outcome == 'success'
        with:
          name: SingleGalaxy-FP3D-SGDX03-Windows-${{ needs.validate.outputs.sha }}
          path: build/SingleGalaxy_FP3D_SGDX03_Windows_Precompiled.zip
          if-no-files-found: error
      - name: Genuine Windows non-headless Godot render plus SQLite restart
        id: window-gate
        continue-on-error: true
        if: steps.package-gate.outcome == 'success'
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          $installedGame=(Resolve-Path 'build/fp3d-env01/installed-image/desktop_godot').Path
          $bundledGodot=Join-Path $installedGame 'runtime/Godot_v4.7.2-stable_win64.exe'
          if(-not(Test-Path -LiteralPath $bundledGodot -PathType Leaf)){
            throw 'Real extracted ZIP missing Godot runtime; refusing alternate system editor'
          }
          & ./desktop_godot/build_tools/Test-WindowedNativeGodot.ps1 -GodotExe $bundledGodot -Project $installedGame -BuildRoot (Resolve-Path build/fp3d-env01).Path -SeedExe (Resolve-Path build/fp3d-env01/Release/galaxy_play_station04a_native_rock_seed.exe).Path
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp3d-sgdx-windows-windowed-render
          path: |
            build/fp3d-env01/godot-visual/*.png
            build/fp3d-env01/godot-visual/windowed-evidence.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp3d-sgdx-windows-evidence-${{ needs.validate.outputs.sha }}
          path: |
            fp3d-env01-windows.xml
            build/fp3d-env01/Testing/Temporary/LastTest.log
            build/fp3d-env01/godot-logs/*.log
            build/fp3d-env01/godot-logs/*.stderr
            build/fp3d-env01/godot-logs/*.json
            build/fp3d-env01/installed-image/desktop_godot/playtest-logs/*.log
            build/fp3d-env01/installed-image/desktop_godot/playtest-logs/result.json
            build/fp3d-env01/installed-image/desktop_godot/runtime/PROVENANCE.txt
          if-no-files-found: warn
      - name: Enforce ALL real native, Godot, packaged Windows and windowed gates
        if: always()
        shell: pwsh
        run: |
          # continue-on-error is only to collect evidence; preserve hard failure.
          $gate=@{
            'native-MSVC-SQLite-private-MDMP'='${{ steps.native-gate.outcome }}'
            'actual-Godot-4.7.2-engine'='${{ steps.godot-gate.outcome }}'
            'real-extracted-selfcontained-ZIP'='${{ steps.package-gate.outcome }}'
            'nonheadless-render-4-original-frames'='${{ steps.window-gate.outcome }}'
          }
          $failed=@($gate.Keys | Where-Object { $gate[$_] -ne 'success' })
          foreach($key in ($gate.Keys | Sort-Object)){
            Write-Host ("{0}: {1}" -f $key, $gate[$key])
          }
          if($failed.Count -gt 0){
            throw ("SGDX03 Windows group NOT ACCEPTED: " + ($failed -join ", "))
          }
          Write-Host 'All Windows native, Godot, packaged ZIP and windowed gates PASS'
