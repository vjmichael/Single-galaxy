name: WORK-01B.2 native workforce qualification and yard capacity

on:
  pull_request:
    paths:
      - 'include/galaxy/WorkCapacity.hpp'
      - 'include/galaxy/WorkPlanning.hpp'
      - 'src/Simulation.cpp'
      - 'tests/WORK01B2_CapacityTests.cpp'
      - 'tests/WORK01B_WorkPlannerTests.cpp'
      - 'tests/WORK01A_UniversalFulfillmentTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/work01b2-capacity.yml'
  workflow_dispatch:

jobs:
  native-work-capacity:
    name: Real NPC availability and physical shipyard capacity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux native SQLite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Windows native SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw 'No Windows vcpkg available' }
          & $vcpkg install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'SQLite installation failed' }
      - name: Configure Linux C++/SQLite
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Configure Windows C++/SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows configuration failed' }
      - name: Build capacity and original physical shipyard acceptance
        run: cmake --build build --parallel 2 --config Release --target galaxy_work01b2_native_capacity_tests galaxy_work01b_work_planner_tests galaxy_work01a_universal_fulfillment_tests galaxy_ship01f_customer_shipyard_tests galaxy_ship01b2_commission_freighter_tests galaxy_ship01a_shipyard_construction_tests
      - name: Verify real worker duty, source conservation and rollback/restart
        run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_(work01b2_native_capacity|work01b_work_planner|work01a_universal_fulfillment|ship01f_customer_shipyard|ship01b2_commission_freighter|ship01a_shipyard_construction)$"
