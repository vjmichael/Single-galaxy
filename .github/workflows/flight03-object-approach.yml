name: FLIGHT-03 universal physical object approach
on:
  pull_request:
    paths:
      - 'include/galaxy/Navigation.hpp'
      - 'src/Navigation.cpp'
      - 'src/Simulation.cpp'
      - 'tests/FLIGHT03_ObjectApproachTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/flight03-object-approach.yml'
  workflow_dispatch:
jobs:
  native-object-approach:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'SQLite install failed' }
      - if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - run: cmake --build build --parallel 2 --config Release --target galaxy_flight03_object_approach_tests galaxy_flight02_local_docking_tests
      - run: ctest --test-dir build -C Release --output-on-failure -R "^galaxy_(flight03_object_approach|flight02_local_docking)$"
