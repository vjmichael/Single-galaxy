name: Colony AUTO-04D5C1 native NPC emergency supplies
on:
  push:
    branches:
      - integration/colony-auto04d5c1-resource-resupply-defense-v80-20261103
  pull_request:
    paths:
      - 'src/Persistence.cpp'
      - 'include/galaxy/Persistence.hpp'
      - 'tests/COLONY_AUTO04D5C1_*'
      - 'CMakeLists.txt'
  workflow_dispatch:
jobs:
  native-supplies-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Build native local stock and emergency control gates
        run: cmake --build build --target galaxy_colony_auto04d5c1_npc_resupply_tests galaxy_colony_auto04d3_repair_tests galaxy_colony_auto04d5b_durable_supervisor_tests -j 2
      - name: Exercise real resource custody and NPC supervisor
        run: ctest --test-dir build --output-on-failure -R 'galaxy_colony_auto04(d5c1_npc_resupply|d3_physical_repair|d5b_durable_supervisor)'
