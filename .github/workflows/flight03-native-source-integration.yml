name: FLIGHT-03 native-source integration
on:
  push:
    branches:
      - feature/flight03-universal-object-approach-20261106
    paths:
      - tools/flight03_apply_native.py
      - tests/FLIGHT03_NativeRendezvousTests.cpp
      - CMakeLists.txt
      - .github/workflows/flight03-native-source-integration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flight03-universal-object-approach-20261106
          persist-credentials: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Apply fail-closed exact-anchor native patch
        run: python3 tools/flight03_apply_native.py
      - name: Verify source edit
        run: git diff --check && git diff --stat
      - name: Configure native kernel
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Compile native rendezvous and inherited station regression
        run: cmake --build build --parallel 2 --target galaxy_flight03_native_rendezvous_tests galaxy_flight02_local_docking_tests
      - name: Run physical and SQLite tests
        run: ctest --test-dir build --output-on-failure -R "^galaxy_(flight03_native_rendezvous|flight02_local_docking)$"
      - name: Commit accepted source on exact branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Simulation.cpp
          git commit -m "FLIGHT-03: integrate verified native rendezvous and v97 recovery" 
          git push origin HEAD:feature/flight03-universal-object-approach-20261106
