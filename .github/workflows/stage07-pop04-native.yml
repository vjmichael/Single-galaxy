name: Stage 7 POP-04 original social autonomy and economic law evidence

on:
  push:
    branches: [sg/stage7-pop04-society-economy-law-20261113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage07-pop04-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  society:
    name: Native original society and material economy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p stage07-pop04-evidence
          printf '%s\n' "$GITHUB_SHA" > stage07-pop04-evidence/source-sha.txt
      - name: Provision Linux original SQLite toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev
      - name: Provision Windows original SQLite toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:VCPKG_INSTALLATION_ROOT
          if(-not $root){$root='C:\vcpkg'}
          & (Join-Path $root 'vcpkg.exe') install sqlite3:x64-windows --classic
          if($LASTEXITCODE -ne 0){throw 'Native Windows SQLite SDK provisioning failed'}
          "SG_TOOLCHAIN=$(Join-Path $root 'scripts\buildsystems\vcpkg.cmake')" >> $env:GITHUB_ENV
          (Join-Path $root 'installed\x64-windows\bin') >> $env:GITHUB_PATH
      - name: Build original social/economic and regression tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S . -B build/stage07-pop04 -G 'Visual Studio 17 2022' -A x64 \
              "-DCMAKE_TOOLCHAIN_FILE=$SG_TOOLCHAIN" -DBUILD_TESTING=ON
          else
            cmake -S . -B build/stage07-pop04 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          fi
          cmake --build build/stage07-pop04 --target \
            galaxy_stage07_society_economy_tests \
            galaxy_colony_exit01d_bounded_tests \
            galaxy_wo2_industry_workforce_tests --config Release --parallel 4
      - name: Original bounded autonomous society and real economic native results
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/stage07-pop04 -C Release --output-on-failure \
            --output-junit "$PWD/stage07-pop04-evidence/native-tests.xml" \
            -R '^(galaxy_stage07_society_economy|galaxy_colony_exit01d_bounded|galaxy_wo2_industry_workforce|galaxy_stage07_delegated_labor)$' \
            --timeout 180 | tee stage07-pop04-evidence/native-ctest.log
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tests=list(ET.parse('stage07-pop04-evidence/native-tests.xml').iter('testcase'))
          required={'galaxy_stage07_society_economy','galaxy_colony_exit01d_bounded',
                    'galaxy_wo2_industry_workforce','galaxy_stage07_delegated_labor'}
          assert len(tests)==4 and {t.get('name') for t in tests}==required
          assert all(t.find(x) is None for t in tests for x in ('failure','error','skipped'))
          with open('stage07-pop04-evidence/receipt.txt','w') as out:
              out.write('head='+Path('stage07-pop04-evidence/source-sha.txt').read_text().strip()+'\n')
              for t in sorted(required):
                  out.write('passed='+t+'\n')
              for exe in ['galaxy_stage07_society_economy_tests',
                          'galaxy_colony_exit01d_bounded_tests',
                          'galaxy_wo2_industry_workforce_tests']:
                  artifact=next(p for p in Path('build/stage07-pop04').rglob(exe+'*')
                                if p.is_file() and p.suffix in ('','.exe'))
                  out.write('exe_sha256:'+exe+'='+hashlib.sha256(artifact.read_bytes()).hexdigest()+'\n')
              out.write('physical_pc_or_install=not_run\n')
          PY
      - name: Retain native CTest, exact source and byte receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage07-pop04-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            stage07-pop04-evidence/
            build/stage07-pop04/Testing/Temporary/LastTest.log
            build/stage07-pop04/Testing/Temporary/LastTestsFailed.log
          retention-days: 14
