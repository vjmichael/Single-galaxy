name: Colony CONFLICT-01B4A autonomous political pressure
on:
  push:
    branches:
      - integration/colony-conflict01b4a-emergency-petition-v86-20261103
  pull_request:
    paths:
      - 'src/Persistence.cpp'
      - 'include/galaxy/ColonyConflict.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'tests/COLONY_CONFLICT01B*'
      - 'CMakeLists.txt'
  workflow_dispatch:
jobs:
  physical-npc-petition-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Build native crisis politics and historical provenance tests
        run: cmake --build build --target galaxy_colony_conflict01b4a_petition_tests galaxy_colony_conflict01b3_governance_tests galaxy_colony_conflict01b2_diplomacy_epoch_tests galaxy_colony_conflict01b1_grievance_tests galaxy_colony_conflict01a_aggressive_intent_tests galaxy_colony_defense01a_watch_tests -j 2
      - name: Test real caucus and original world replay
        run: ctest --test-dir build --output-on-failure -R 'galaxy_colony_(conflict01b4a_petition|conflict01b3_governance|conflict01b2_diplomacy_epoch|conflict01b1_grievance|conflict01a_aggressive_intent|defense01a_local_watch)'
