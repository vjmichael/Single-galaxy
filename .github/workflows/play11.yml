name: PLAY-11 native ship fittings and exploration sensor
on:
  push:
    branches:
      - integration/play11-ship-fitting-exploration-20261104
  pull_request:
    paths:
      - 'include/galaxy/Simulation.hpp'
      - 'src/Simulation.cpp'
      - 'src/colony_live_host.cpp'
      - 'viewer/colony.js'
      - 'viewer/interactive.js'
      - 'viewer/interactive.html'
      - 'live/interactive_relay.py'
      - 'tests/PLAY11_FittingExplorationTests.cpp'
      - 'tests/PLAY11_FittingWiringTests.js'
      - '.github/workflows/play11.yml'
jobs:
  fitting-and-survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native game
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build fittings, exploration, salvage and live host
        run: cmake --build build --target galaxy_play11_fitting_tests galaxy_play10_exploration_tests galaxy_play09_wreck_salvage_tests galaxy_colony_live_host -j2
      - name: Verify native conservation and persistent fitting
        run: ctest --test-dir build -R '^galaxy_play(09_wreck_salvage|10_exploration|11_fitting)$' --output-on-failure
      - name: Verify native telemetry and browser integration
        run: node --test tests/PLAY11_FittingWiringTests.js tests/ExplorationJournalTests.js tests/PLAY10_ExplorationWiringTests.js tests/PLAY09_SalvageWiringTests.js tests/PLAY08_CombatWiringTests.js tests/TravelAssistTests.js tests/Play07WiringTests.js tests/FlightCameraTests.js tests/Play06WiringTests.js tests/ExpeditionFeedbackTests.js tests/ExpeditionWiringTests.js tests/CargoReturnTests.js tests/FlightControlsTests.js tests/OpeningGuideTests.js
      - name: Verify browser and relay parse
        run: |
          node --check viewer/colony.js
          node --check viewer/interactive.js
          node --check viewer/viewer.js
          python3 -m py_compile live/interactive_relay.py
