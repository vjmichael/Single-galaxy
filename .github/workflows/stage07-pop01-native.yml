name: Stage 7 population and household lifecycle native acceptance

on:
  push:
    branches: [sg/stage6f5e-installed-terrain-recovery-20261112]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage07-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-population:
    name: Original Stage 7 birth, custody and migration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Pin original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p stage07-native-evidence
          printf '%s\n' "$GITHUB_SHA" > stage07-native-evidence/source-sha.txt
      - name: Install Linux native SQLite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev
      - name: Install Windows native SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:VCPKG_INSTALLATION_ROOT
          if(-not $root){$root='C:\vcpkg'}
          & (Join-Path $root 'vcpkg.exe') install sqlite3:x64-windows --classic
          if($LASTEXITCODE -ne 0){throw 'Native Windows SQLite SDK provisioning failed'}
          "SG_TOOLCHAIN=$(Join-Path $root 'scripts\buildsystems\vcpkg.cmake')" >> $env:GITHUB_ENV
          (Join-Path $root 'installed\x64-windows\bin') >> $env:GITHUB_PATH
      - name: Compile original Stage 7 native executables
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S . -B build/stage07-native -G 'Visual Studio 17 2022' -A x64 \
              "-DCMAKE_TOOLCHAIN_FILE=$SG_TOOLCHAIN" -DBUILD_TESTING=ON
          else
            cmake -S . -B build/stage07-native -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON
          fi
          cmake --build build/stage07-native --target \
            galaxy_stage07_population_household_tests \
            galaxy_colony_auto04d4d2_physical_tests \
            v59_paired_household_settlement \
            galaxy_wo2_industry_workforce_tests --config Release --parallel 4
      - name: Verify unchanged original Stage 7 CTests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/stage07-native -C Release \
            --output-on-failure --output-junit "$PWD/stage07-native-evidence/native-tests.xml" \
            -R '^(galaxy_stage07_population_households|galaxy_stage07_household_lifecycle_birth|galaxy_stage07_household_lifecycle_migration|galaxy_wo2_industry_workforce|galaxy_stage07_delegated_labor)$' \
            --timeout 180 | tee stage07-native-evidence/native-ctest.log
          python - <<'PY'
          import hashlib,pathlib,xml.etree.ElementTree as ET
          original=pathlib.Path('stage07-native-evidence/source-sha.txt').read_text().strip()
          cases=list(ET.parse('stage07-native-evidence/native-tests.xml').iter('testcase'))
          required={'galaxy_stage07_population_households',
                    'galaxy_stage07_household_lifecycle_birth',
                    'galaxy_stage07_household_lifecycle_migration',
                    'galaxy_wo2_industry_workforce',
                    'galaxy_stage07_delegated_labor'}
          assert len(cases)==5 and {c.get('name') for c in cases}==required
          assert all(c.find(t) is None for c in cases for t in ('failure','error','skipped'))
          root=pathlib.Path('build/stage07-native')
          hashes={}
          for name in ('galaxy_stage07_population_household_tests',
                       'galaxy_colony_auto04d4d2_physical_tests',
                       'v59_paired_household_settlement',
                       'galaxy_wo2_industry_workforce_tests'):
              exe=next(p for p in root.rglob(name+'*') if p.is_file() and p.suffix in ('','.exe'))
              hashes[name]=hashlib.sha256(exe.read_bytes()).hexdigest()
          with open('stage07-native-evidence/receipt.txt','w') as out:
              out.write(f'exact_head={original}\n')
              for test in sorted(required):
                  out.write(f'native_test={test}:passed\n')
              for name,digest in sorted(hashes.items()):
                  out.write(f'executable_sha256:{name}={digest}\n')
              out.write('installed_or_physical_pc=not_run\n')
          PY
      - name: Preserve original receipt and native failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage07-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            stage07-native-evidence/
            build/stage07-native/Testing/Temporary/LastTest.log
            build/stage07-native/Testing/Temporary/LastTestsFailed.log
          retention-days: 21
