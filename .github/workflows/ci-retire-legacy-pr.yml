name: CI legacy PR-trigger retirement — one-time repository control

# Owner directive: native OS acceptance only at completed task-group boundary.
# This workflow itself is a one-time maintenance action, never a per-commit gate.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-retire-legacy-pr.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Audit only, do not disable historical PR workflows'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: sg-ci-retire-legacy-pr
  cancel-in-progress: false

jobs:
  retire:
    if: github.repository == 'vjmichael/Single-galaxy' && github.ref == 'refs/heads/main'
    name: Disable registered branch-only PR workflows; preserve main gates
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Disable registered historical PR workflows only
        uses: actions/github-script@v7
        env:
          CI_RETIRE_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const dryRun = String(process.env.CI_RETIRE_DRY_RUN).toLowerCase() === 'true';
            const manifest = {
              schema: 'SG-CI-LEGACY-RETIRE-01',
              timestamp_utc: new Date().toISOString(),
              repo: owner + '/' + repo,
              default_branch: 'main',
              dry_run: dryRun,
              registered: 0,
              active_branch_only: 0,
              matched_pr_history: 0,
              disable_success: 0,
              failed: 0,
              preserved_default_branch: [],
              skipped: [],
              disabled: [],
              failures: []
            };
            try {
              const paths = await github.rest.repos.getContent({
                owner,repo,path:'.github/workflows',ref:'main'
              });
              if(!Array.isArray(paths.data)) throw new Error('Expected main workflow directory');
              const mainFiles = new Set(paths.data
                .filter(f=>f.type === 'file')
                .map(f=>f.path));
              for (const mustKeep of [
                '.github/workflows/ci-queue-hygiene.yml',
                '.github/workflows/ci-task-group-acceptance.yml',
                '.github/workflows/ci-retire-legacy-pr.yml'
              ]) {
                if(!mainFiles.has(mustKeep))
                  throw new Error('Refusing changes; missing critical main workflow '+mustKeep);
              }
              const workflows = await github.paginate(
                github.rest.actions.listRepoWorkflows,
                {owner,repo,per_page:100}
              );
              manifest.registered = workflows.length;
              for(const w of workflows) {
                const canonical = String(w.path || '').split('@')[0];
                const entry = {id:w.id,name:w.name,path:w.path,state:w.state};
                if (mainFiles.has(canonical)) {
                  manifest.preserved_default_branch.push(entry);
                  continue;
                }
                if (!canonical.startsWith('.github/workflows/') || w.state !== 'active') {
                  manifest.skipped.push({...entry,reason:'inactive or non-workflow path'});
                  continue;
                }
                manifest.active_branch_only++;
                // Disable only workflows which actually have auto PR run history.
                // Leave manual-only or unrecognized branch workflows untouched.
                let prRuns;
                try {
                  prRuns = await github.rest.actions.listWorkflowRuns({
                    owner,repo,workflow_id:w.id,event:'pull_request',per_page:1
                  });
                } catch (error) {
                  manifest.failures.push({...entry,stage:'inspect_runs',http:error.status || 0,error:String(error.message).slice(0,240)});
                  manifest.failed++;
                  continue;
                }
                if (!(prRuns.data.total_count > 0)) {
                  manifest.skipped.push({...entry,reason:'no pull_request runs recorded'});
                  continue;
                }
                manifest.matched_pr_history++;
                if(dryRun) {
                  manifest.skipped.push({...entry,reason:'matched PR history; dry_run only'});
                  continue;
                }
                try {
                  await github.rest.actions.disableWorkflow({owner,repo,workflow_id:w.id});
                  manifest.disabled.push({...entry,outcome:'disabled_manually'});
                  manifest.disable_success++;
                } catch (error) {
                  manifest.failures.push({...entry,stage:'disable',http:error.status || 0,error:String(error.message).slice(0,240)});
                  manifest.failed++;
                }
              }
            } catch(error) {
              manifest.failures.push({stage:'top_level',error:String(error.message).slice(0,500)});
              manifest.failed++;
            } finally {
              fs.writeFileSync('sg-ci-legacy-retire.json',JSON.stringify(manifest,null,2)+'\n');
              core.info('Registered '+manifest.registered+
                        ', matched prior PR workflows '+manifest.matched_pr_history+
                        ', disabled '+manifest.disable_success+
                        ', failures '+manifest.failed+
                        ', protected default-branch workflows '+manifest.preserved_default_branch.length);
              await core.summary.addHeading('Legacy PR workflow retirement')
                .addTable([
                  [{data:'Measure',header:true},{data:'Count',header:true}],
                  ['Registered workflow definitions',String(manifest.registered)],
                  ['Active branch-only PR workflows',String(manifest.matched_pr_history)],
                  ['Disabled via GitHub API',String(manifest.disable_success)],
                  ['API failures',String(manifest.failed)],
                  ['Protected main workflows',String(manifest.preserved_default_branch.length)]
                ]).write();
              if(manifest.failed) core.setFailed('Some legacy PR workflows were not disabled; inspect artifact.');
            }
      - name: Archive exact workflow IDs and disable outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-ci-legacy-retirement-${{ github.run_id }}
          path: sg-ci-legacy-retire.json
          if-no-files-found: warn
