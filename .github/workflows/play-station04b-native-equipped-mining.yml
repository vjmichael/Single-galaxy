name: PLAY-STATION-04B fitted drill and true one-tonne extraction
on:
  push:
    branches:
      - sg/play-station04b-equipped-one-tonne-20261108
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play-station04b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Ubuntu real C++ mining, SQLite pipe and official Godot 4.7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build genuine original world, native player and ore fixture
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev ninja-build unzip
          cmake -S . -B build/sg04b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          cmake --build build/sg04b --parallel 2 --target \
            galaxy_play_station04b_original_mining_tests \
            galaxy_play_station04b_native_mining_seed \
            galaxy_desktop_player_host \
            galaxy_play_station04a_original_asteroid_contact_tests
      - name: Original 1000kg ore, fitting, no replay and actual SQLite child test
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/sg04b --no-tests=error --timeout 180 --output-on-failure \
            --output-junit sg04b-linux.xml \
            -R '^galaxy_play_station04(b_original_mining|b_native_mining_pipe|a_original_asteroid_contact)$'
      - name: Source invariants before real Godot runtime
        shell: bash
        run: |
          set -euxo pipefail
          python desktop_godot/tests/test_gdscript_preload_sanity.py
          python desktop_godot/tests/test_native_mining_04b_contract.py
          python desktop_godot/tests/test_native_asteroid_contact_contract.py
      - name: Download official Godot 4.7.2 and exercise native receipts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/sg04b-godot" build/sg04b/godot-logs
          curl --fail --location --retry 3 --retry-delay 5 \
            -o "$RUNNER_TEMP/sg04b-godot/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq "$RUNNER_TEMP/sg04b-godot/godot.zip" -d "$RUNNER_TEMP/sg04b-godot"
          G="$RUNNER_TEMP/sg04b-godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$G"
          "$G" --version
          "$G" --headless --path desktop_godot --editor --quit \
            2>&1 | tee build/sg04b/godot-logs/import.log
          for test in godot_smoke.gd native_player_protocol_smoke.gd \
            native_asteroid_contact_smoke.gd native_mining_04b_smoke.gd; do
            "$G" --headless --path desktop_godot --script "res://tests/$test" \
              2>&1 | tee "build/sg04b/godot-logs/$test.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sg04b-linux-native-godot-${{ github.sha }}
          path: |
            sg04b-linux.xml
            build/sg04b/Testing/Temporary/LastTest.log
            build/sg04b/godot-logs/*.log
            build/sg04b/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
  windows:
    name: Windows MSVC original drill, native SQLite, Godot and playable ZIP
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual Windows SQLite dependency
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vcpkg=$env:VCPKG_INSTALLATION_ROOT
          if(-not $vcpkg){$vcpkg='C:\vcpkg'}
          & (Join-Path $vcpkg 'vcpkg.exe') install sqlite3:x64-windows --classic
          if($LASTEXITCODE -ne 0){throw 'vcpkg SQLite install failed'}
          "SG_VCPKG_TOOLCHAIN=$(Join-Path $vcpkg 'scripts\buildsystems\vcpkg.cmake')" >> $env:GITHUB_ENV
          (Join-Path $vcpkg 'installed\x64-windows\bin') >> $env:GITHUB_PATH
      - name: Build actual MSVC original world and executable hosts
        shell: pwsh
        run: |
          cmake -S . -B build/sg04b -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF "-DCMAKE_TOOLCHAIN_FILE=$env:SG_VCPKG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows
          if($LASTEXITCODE -ne 0){throw '04B native configure failed'}
          cmake --build build/sg04b --config Release --parallel 2 --target galaxy_play_station04b_original_mining_tests galaxy_play_station04b_native_mining_seed galaxy_desktop_player_host galaxy_desktop_station_host galaxy_play_station04a_original_asteroid_contact_tests
          if($LASTEXITCODE -ne 0){throw '04B native MSVC build failed'}
      - name: Run real Windows 1t ore ledger and child execution
        shell: pwsh
        run: |
          ctest --test-dir build/sg04b -C Release --no-tests=error --timeout 180 --output-on-failure --output-junit sg04b-windows.xml -R '^galaxy_play_station04(b_original_mining|b_native_mining_pipe|a_original_asteroid_contact)$'
          if($LASTEXITCODE -ne 0){throw 'Original 04B MSVC ore or native SQLite test failed'}
          python desktop_godot/tests/test_gdscript_preload_sanity.py
          python desktop_godot/tests/test_native_mining_04b_contract.py
          python desktop_godot/tests/test_native_asteroid_contact_contract.py
          if($LASTEXITCODE -ne 0){throw '04B source check failed'}
      - name: Download official Windows Godot 4.7.2 editor for parser tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build/sg04b/godot | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile build/sg04b/godot/editor.zip
          Expand-Archive build/sg04b/godot/editor.zip -DestinationPath build/sg04b/godot -Force
          $g=Get-ChildItem build/sg04b/godot -Filter '*win64_console.exe' -Recurse | Select-Object -First 1
          if(-not $g){$g=Get-ChildItem build/sg04b/godot -Filter '*win64.exe' -Recurse | Select-Object -First 1}
          if(-not $g){throw 'Official Godot editor missing'}
          "SG_GODOT=$($g.FullName)" >> $env:GITHUB_ENV
      - name: Actual Windows Godot parser and native 04B receipt smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build/sg04b/godot-logs | Out-Null
          & $env:SG_GODOT --version
          if($LASTEXITCODE -ne 0){throw 'Godot launch failed'}
          & $env:SG_GODOT --headless --path desktop_godot --editor --quit 2>&1 | Out-File build/sg04b/godot-logs/import.log
          if($LASTEXITCODE -ne 0){throw '04B Godot project import failed'}
          foreach($test in @('godot_smoke.gd','native_player_protocol_smoke.gd','native_asteroid_contact_smoke.gd','native_mining_04b_smoke.gd')){
            & $env:SG_GODOT --headless --path desktop_godot --script "res://tests/$test" 2>&1 | Out-File "build/sg04b/godot-logs/$test.log"
            if($LASTEXITCODE -ne 0){throw "Actual Godot script failed: $test"}
          }
      - name: Stage precompiled Windows game with finite mining seed and launch command
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='build/SingleGalaxy_Station_04B_Windows'
          $game=Join-Path $root 'desktop_godot'
          New-Item -ItemType Directory -Force $game | Out-Null
          Copy-Item desktop_godot/project.godot $game -Force
          foreach($dir in @('world','tests','build_tools')){
            Copy-Item (Join-Path desktop_godot $dir) (Join-Path $game $dir) -Recurse -Force
          }
          Copy-Item desktop_godot/RUN_STATION_PLAYTEST_WINDOWS.cmd $game -Force
          Copy-Item desktop_godot/RUN_MINING_04B_WINDOWS.cmd $game -Force
          New-Item -ItemType Directory -Force (Join-Path $game native) | Out-Null
          foreach($name in @('galaxy_desktop_station_host.exe','galaxy_desktop_player_host.exe','galaxy_play_station04b_native_mining_seed.exe')){
            $compiled=Join-Path 'build/sg04b/Release' $name
            if(-not(Test-Path $compiled)){throw "Missing compiled original binary: $name"}
            Copy-Item $compiled (Join-Path $game native) -Force
          }
          $vcpkg=$env:VCPKG_INSTALLATION_ROOT
          if(-not $vcpkg){$vcpkg='C:\vcpkg'}
          $bin=Join-Path $vcpkg 'installed\x64-windows\bin'
          if(-not(Test-Path (Join-Path $bin 'sqlite3.dll'))){throw 'sqlite3.dll missing'}
          Get-ChildItem $bin -Filter '*.dll' | ForEach-Object {Copy-Item $_.FullName (Join-Path $game native) -Force}
          python tests/PLAY_STATION_04B_NativeMiningPipeTests.py build/sg04b/Release/galaxy_play_station04b_native_mining_seed.exe (Join-Path $game 'native/galaxy_desktop_player_host.exe')
          if($LASTEXITCODE -ne 0){throw 'Staged 04B native Windows executable failed genuine SQLite pipe'}
          "Exact source SHA: $env:GITHUB_SHA" | Set-Content (Join-Path $root SOURCE_SHA.txt)
          'PLAY-STATION-04B: Extract the package, then run desktop_godot/RUN_MINING_04B_WINDOWS.cmd. Use your existing Godot 4.7.2 editor. P cockpit, E sit, G fabricate, F fit, K power, M mine 1t, V exterior. This is an explicit finite test save and never automatically restocks.' | Set-Content (Join-Path $root START_HERE.txt)
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath build/SingleGalaxy_Station_04B_Windows_Precompiled.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SingleGalaxy-Station-04B-Windows-Precompiled-${{ github.sha }}
          path: build/SingleGalaxy_Station_04B_Windows_Precompiled.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sg04b-windows-evidence-${{ github.sha }}
          path: |
            sg04b-windows.xml
            build/sg04b/Testing/Temporary/LastTest.log
            build/sg04b/godot-logs/*.log
            build/sg04b/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
