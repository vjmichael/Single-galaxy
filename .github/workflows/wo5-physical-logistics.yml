name: WO5 original physical logistics and WO4 demand freight linkage
on:
  pull_request:
    paths:
      - 'include/galaxy/WO5PhysicalResupply.hpp'
      - 'include/galaxy/WO5IntercolonyBooking.hpp'
      - 'include/galaxy/WO5FreightEvidence.hpp'
      - 'include/galaxy/WO5DelegatedLogistics.hpp'
      - 'include/galaxy/SeamlessSpatialOwnership.hpp'
      - 'include/galaxy/SeamlessCellWorker.hpp'
      - 'include/galaxy/GalacticCoordinates.hpp'
      - 'include/galaxy/GalacticFloatingFrame.hpp'
      - 'tests/GalacticFloatingFrameTests.cpp'
      - 'include/galaxy/GalacticSystemRegistry.hpp'
      - 'tests/SeamlessSpatialOwnershipTests.cpp'
      - 'include/galaxy/WO5RegionalFreightFence.hpp'
      - 'include/galaxy/WO5RegionalRecovery.hpp'
      - 'include/galaxy/RegionalCheckpointStore.hpp'
      - 'include/galaxy/RegionalModeAuthority.hpp'
      - 'src/RegionalModeAuthority.cpp'
      - 'tests/PLAY13D_RegionalFacilitiesTests.cpp'
      - 'include/galaxy/WO5ManufacturedFreight.hpp'
      - 'include/galaxy/WO5ManufacturedEvidence.hpp'
      - 'tests/V59_multi_destination_host.cpp'
      - 'src/ThirdPartyShipment.cpp'
      - 'src/CanonicalShippingHost.cpp'
      - 'src/ShipmentStatusView.cpp'
      - 'tests/WO5PhysicalLogisticsTests.cpp'
      - 'include/galaxy/WO4ResourceDemand.hpp'
      - 'include/galaxy/WO4Allocation.hpp'
      - 'include/galaxy/WO4LocalAllocation.hpp'
      - 'include/galaxy/WO4ConsumptionProfiles.hpp'
      - 'include/galaxy/WO4RegionalDistribution.hpp'
      - 'include/galaxy/WO4MaterialAllocation.hpp'
      - 'include/galaxy/WO4GoodsRegional.hpp'
      - 'tests/WO4MaterialAllocationTests.cpp'
      - 'tests/WO4ResourceDemandTests.cpp'
      - 'tests/WO3PlanetaryUtilityTests.cpp'
      - 'src/Industry01Catalog.generated.cpp'
      - 'src/MacroNeeds.cpp'
      - 'include/galaxy/WO3ColonyOperations.hpp'
      - 'src/Simulation.cpp'
      - 'src/Persistence.cpp'
      - 'include/galaxy/Simulation.hpp'
      - 'include/galaxy/Persistence.hpp'
      - 'CMakeLists.txt'
      - '.github/workflows/wo5-physical-logistics.yml'
      - '.github/workflows/wo4-resource-demand.yml'
  workflow_dispatch:
concurrency:
  group: sg-wo5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physical-source:
    name: Exact source physical shipments and SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Requested WO5 source: $expected"
          echo "Running WO5 source:   $actual"
          test "$actual" = "$expected"
          cmake --version
      - name: Install system SQLite SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ninja-build
      - name: Install Windows SQLite SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw 'Windows vcpkg SDK missing' }
          & $vcpkg install sqlite3:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'Windows SQLite SDK install failed' }
      - name: Configure Linux original kernel
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
      - name: Configure Windows original kernel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tc = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$tc" -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Windows original configure failed' }
      - name: Build WO5 physically routed freight and upstream WO3/WO4 regressions
        run: cmake --build build --config Release --parallel 2 --target galaxy_floating_frame_tests galaxy_seamless_spatial_ownership_tests galaxy_econ03c7modeauthoritytests galaxy_econ03c8bworldreconciliationtests v59_region_scoped_handoff v59_multi_destination_host v59_third_party_custody v59_world_finished_goods_logistics galaxy_shipping_status_bridge galaxy_wo5_physical_logistics_tests galaxy_play13d_regional_facilities_tests galaxy_wo4_resource_demand_tests galaxy_wo4_material_allocation_tests galaxy_wo3_colony_operations_tests galaxy_wo3_planetary_housing_tests galaxy_wo3_planetary_utility_tests galaxy_wo2_industry_workforce_tests
      - name: Verify physical shuttle and freight receipts, rollback and independent SQLite recovery
        run: ctest --test-dir build -C Release --output-on-failure --output-junit build/wo5-native-results.xml -R "^(v59_(multi_destination_host|region_scoped_handoff|third_party_custody|world_finished_goods_logistics)|galaxy_(floating_frame|seamless_spatial_ownership|econ03c7modeauthoritytests|econ03c8bworldreconciliationtests|shipping_transport_real_world_tests|work01c_native_transport_executors|wo5_physical_logistics|wo4_resource_demand|wo4_material_allocation|wo3_planetary_utility|wo3_planetary_housing|ship01c_manufactured_freight|flight04b_real_freight))$"
      - name: Retain executed native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo5-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/wo5-native-results.xml
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 14
