name: PLAY-13D planetary agriculture native acceptance
on:
  push:
    branches: [feature/play13d-planetary-agriculture-20261104]
  pull_request:
    paths:
      - 'include/galaxy/PlanetaryAgriculture.hpp'
      - 'src/PlanetaryAgriculture.cpp'
      - 'tests/PLAY13D_PlanetaryAgricultureTests.cpp'
      - 'include/galaxy/PlanetaryRegions.hpp'
      - 'tests/PLAY13D_PlanetaryRegionsTests.cpp'
      - 'include/galaxy/PlanetaryLandscape.hpp'
      - 'tests/PLAY13D_PlanetaryLandscapeTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/play13d.yml'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build real galaxy kernel and planetary test
        run: cmake --build build --config Release --target galaxy_play13d_planetary_agriculture_tests galaxy_play13d_planetary_regions_tests galaxy_play13d_planetary_landscape_tests
      - name: Native mass conservation and return logistics
        run: ctest --test-dir build -C Release -R "^galaxy_play13d_planetary_(agriculture|regions|landscape)$" --output-on-failure
